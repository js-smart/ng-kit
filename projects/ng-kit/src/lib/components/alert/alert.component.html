@if (open()) {
	<div class="grid {{ class() }}">
		<div class="g-col-12 alert-grid-cell">
			<div class="alert alert-{{ type() }} alert-dismissible alert_div" role="alert" aria-live="polite">
				<ng-content></ng-content>
				@if (dismissible()) {
					<button (click)="closeAlert()" aria-label="Close" class="btn-close" data-bs-dismiss="alert" type="button"></button>
				}
			</div>
		</div>
	</div>
}
