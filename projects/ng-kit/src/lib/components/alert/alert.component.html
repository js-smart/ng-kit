@if (open()) {
	<div class="row {{ class() }}">
		<div class="col-12 col-md-auto md:col-auto mx-auto">
			<div class="alert {{ typeClasses() }} alert-dismissible alert_div" role="alert" aria-live="polite">
				<ng-content></ng-content>
				@if (dismissible()) {
					<button (click)="closeAlert()" aria-label="Close" class="btn-close" type="button"></button>
				}
			</div>
		</div>
	</div>
}
